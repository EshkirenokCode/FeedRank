[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"
[project]
name = "feedrank"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["torch==2.15.0", "numpy==2.5.4", "scikit-learn==1.9.1", "fastapi==0.162.0", "uvicorn==0.54.0", "psutil==7.2.2"]
[tool.setuptools]
packages = ["feedrank"]
[tool.ruff]
line-length = 100
[tool.pytest.ini_options]
pythonpath = ["."]
