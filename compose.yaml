name: feedrank
services:
  api:
    build: .
    image: feedrank:local
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m
    volumes:
      - sessions:/app/runtime
    environment:
      FEEDRANK_DB: /app/runtime/sessions.sqlite
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://127.0.0.1:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
    cpus: 1.0
    mem_limit: 1g
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  web:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cpus: 0.25
    mem_limit: 64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  sessions:
